name: Publish to crates.io

on:
  release:
    types: [published]

jobs:
  publish-rust:
    permissions:
      contents: read
      id-token: write
    name: Publish Rust crate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: prm_auth
        # Trusted publishing first; the publish step falls back to the token secret.
        continue-on-error: true

      - name: Publish to crates.io
        working-directory: rust
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Trusted publishing returned no token. Register this workflow as a crates.io trusted publisher or configure CARGO_REGISTRY_TOKEN or CARGO_TOKEN as a repository secret."
            exit 1
          fi
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.prm_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
