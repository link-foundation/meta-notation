[package]
name = "meta-notation"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the Meta-Notation parser"
license = "Unlicense"
repository = "https://github.com/link-foundation/meta-notation"
keywords = ["meta", "parser", "notation", "delimiters"]
categories = ["parsing"]

[lib]
name = "meta_notation"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
